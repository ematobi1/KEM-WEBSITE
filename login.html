<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KEM Logistics Admin Login">
    <title>Admin Login - KEM Logistics</title>
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header class="header" role="banner">
        <nav class="navbar" role="navigation" aria-label="Main navigation">
            <div class="container">
                <div class="nav-wrapper">
                    <div class="logo">
                        <a href="index.html" aria-label="KEM Logistics home">
                            <img src="images/kem-logo.jpeg" alt="KEM Logistics & Solutions" class="logo-img">
                        </a>
                    </div>
                    <ul class="nav-links">
                        <li><a href="index.html">← Back to Website</a></li>
                        <li><a href="customer-login.html">Customer Portal</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main id="main-content" role="main">
        <section class="login-section">
            <div class="container">
                <div class="login-container" style="max-width:500px;margin:0 auto;display:block">
                    <div class="login-box">
                        <div style="text-align:center;margin-bottom:1.5rem">
                            <span style="background:var(--primary-color);color:var(--text-dark);padding:0.35rem 1rem;border-radius:var(--radius-sm);font-size:0.8rem;font-weight:700;letter-spacing:0.05em">ADMIN ACCESS ONLY</span>
                        </div>

                        <h1>Admin Sign In</h1>
                        <p class="login-subtitle">KEM Logistics management portal</p>

                        <form id="loginForm" class="login-form">
                            <div class="form-group">
                                <label for="login-email">Email Address</label>
                                <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="admin@kemlogistics.com">
                            </div>
                            <div class="form-group">
                                <label for="login-password">Password</label>
                                <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                            </div>
                            <div class="form-options">
                                <label class="checkbox-label">
                                    <input type="checkbox" name="remember" id="remember-me">
                                    <span>Remember me</span>
                                </label>
                                <a href="#" class="forgot-password">Forgot password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary btn-large login-btn">Sign In</button>
                        </form>

                        <div id="loginMessage" class="login-message" role="alert" style="display:none"></div>

                        <div class="login-footer" style="margin-top:1.5rem">
                            <p>Not an admin? <a href="customer-login.html">Customer portal →</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 KEM Logistics And Solutions LLC. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
